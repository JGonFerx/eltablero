<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Tarifas | El Tablero Sport Club</title>
    <meta name="description" content="Elige las tarifas de sala fitness o pádel de El Tablero Sport Club.">
    <link rel="canonical" href="https://eltablerosportclub.com/">
    <link rel="icon" href="../assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        background: radial-gradient(circle at 78% 18%, rgba(201, 130, 92, 0.16), transparent 24rem), #fbfaf6;
        color: #171816;
      }

      .compat-shell {
        width: min(100% - 2rem, 54rem);
        padding: clamp(2rem, 6vw, 4rem);
      }

      .compat-kicker {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1rem;
        color: #9d603e;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .compat-kicker::before {
        content: "";
        width: 2.4rem;
        height: 2px;
        background: currentColor;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 5rem);
        letter-spacing: -0.05em;
        line-height: 0.95;
      }

      p {
        max-width: 44rem;
        margin: 1rem 0 0;
        color: #5f5b55;
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.55;
      }

      .compat-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      .compat-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.8rem;
        padding: 0 1.65rem;
        border: 1px solid rgba(23, 24, 22, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #171816;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 0.75rem 2rem rgba(23, 24, 22, 0.06);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          color 180ms ease;
      }

      .compat-button:hover,
      .compat-button:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(157, 96, 62, 0.42);
        background: #ffffff;
        color: #171816;
      }

      .compat-button--primary {
        border-color: #171816;
        background: #171816;
        color: #fbfaf6;
      }

      .compat-button--primary:hover,
      .compat-button--primary:focus-visible {
        border-color: #9d603e;
        background: #9d603e;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="compat-shell">
      <p class="compat-kicker">Tarifas</p>
      <h1>Elige qué tarifas quieres consultar</h1>
      <p>La nueva web organiza las tarifas por servicio para que llegues directamente a la información correcta.</p>
      <div class="compat-actions" aria-label="Opciones de tarifas">
        <a class="compat-button compat-button--primary" href="../gimnasio/index.html#tarifas">Tarifas abonados</a>
        <a class="compat-button" href="../padel/index.html#tarifas">Tarifas pádel</a>
        <a class="compat-button" href="../index.html">Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
